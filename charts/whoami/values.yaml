replicaCount: 1

image:
  repository: traefik/whoami
  tag: ""                 # vide => .Chart.AppVersion
  pullPolicy: IfNotPresent

containerPort: 8080

# Variables d'environnement (boucle range dans deployment.yaml)
env:
  WHOAMI_NAME: whoami
  LOG_LEVEL: info

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  host: whoami.lab.local
  path: /

probes:
  path: /health

resources:
  requests: { cpu: 20m, memory: 16Mi }
  limits:   { cpu: 100m, memory: 64Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
